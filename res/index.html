<!doctype html>
<html lang="zh" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/pico.css">
    <link rel="stylesheet" href="css/custom.css">
    <title id="app-title">背景课表</title>
    <script src="config/config.js"></script>
    <!-- 音频通知 -->
    <audio id="regularNotification" preload="auto"></audio>
    <audio id="endingNotification" preload="auto"></audio>
    <link rel="icon" type="image/x-icon" id="app-favicon" href="favicon.ico">
</head>

<body id="body-html" style="overflow:hidden;">

    <main class="container-fluid" id="main-container">
        <div id="glass">
            <!-- 课程表组件 -->
            <div class="grid" id="classtable">
                <!-- 课程表头部将通过JavaScript动态生成 -->
            </div>
            
            <!-- 进度条组件 -->
            <progress id="nav-pro" value="25" max="100" hidden></progress>
            
            <script src="js/class.js"></script>
            
            <section>
                <div class="grid">
                    
                    <div>
                        <!-- 时钟组件 -->
                        <article id="clockart">
                            <header id="clock-header" hidden>
                                <a href="#close" aria-label="关闭" class="close"></a>
                                <span id="clock-header-text">⏰ 时钟</span>
                            </header>
                            | <strong id="time-a">时间</strong> |
                            <strong id="date-a">日期</strong> |
                            <strong id="weekday-a">星期</strong>
                            <br>|
                            <strong id="week-a">周次</strong> |
                            <strong id="prog-description"></strong>
                            <progress id="prog" value="25" max="100"></progress>
                        </article>
                        
                        <!-- 事件日历组件 -->
                        <article id="calart">
                            <header id="calendar-header" hidden>
                                <a href="#close" aria-label="关闭" class="close"></a>
                                <span id="calendar-header-text">📅 事件日历</span>
                            </header>
                            <ul id="evcal"></ul>
                        </article>
                        <script src="js/event_cal.js"></script>
                        
                        <!-- 告示牌组件 -->
                        <article id="helpart">
                            <header id="help-header" hidden>
                                <a href="#close" aria-label="关闭" class="close"></a>
                                <span id="help-header-text">📚 告示牌</span>
                            </header>
                            <div id="help"></div>
                        </article>
                        <script src="js/help.js"></script>
                    </div>
                </div>
            </section>
        </div>
    </main>
    
    <!-- LLM集成接口 -->
    <div id="llm-interface" style="display: none;">
        <button id="llm-adjust-layout">智能调整布局</button>
        <button id="llm-generate-content">生成内容</button>
        <button id="llm-optimize-schedule">优化课程安排</button>
    </div>
    
    <script src="js/ui-manager.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
